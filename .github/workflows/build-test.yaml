name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
permissions:
  pull-requests: write
  actions: write
  checks: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Package app
        uses: livehybrid/deploy-splunk-app-action@main
        with:
          python-version: "3.9"

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
  
  integration-test:
    name: integration-test (splunk-docker)
    needs: package
    # Dependabot actors get no egress/secrets, so a live-data E2E can only fail
    # for them. CLI AppInspect still covers Dependabot PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.1.0
          rm -rf stage && mkdir -p stage
          cp -r output/TA-nextdns-api stage/TA-nextdns-api
          # Point the collectors at the mock upstream via the app-local override
          # file (splunkd does not pass the container env var to modular-input
          # processes, so the env var alone does not reach them).
          mkdir -p stage/TA-nextdns-api/local
          echo "http://mock:8080" > stage/TA-nextdns-api/local/nextdns_api_base
          # The test container's splunk user (a different uid) must read the app
          # and write local/inputs.conf + checkpoints into the bind mount. Wide
          # perms are fine on this throwaway copy — it is never the artefact.
          chmod -R 777 stage/TA-nextdns-api

      - name: Start Splunk (wait for health)
        working-directory: docker
        run: docker compose up -d --wait --wait-timeout 360

      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_nextdns_api_splunk
        run: pytest tests/ -v -ra

      - name: Diagnostics on failure
        if: failure()
        working-directory: docker
        run: |
          echo "===== did NEXTDNS_API_BASE reach splunkd's environment? ====="
          pid=$(docker exec ta_nextdns_api_splunk bash -lc "pgrep -f 'splunkd.*-p ' | head -1") || true
          docker exec ta_nextdns_api_splunk bash -lc "tr '\0' '\n' < /proc/${pid}/environ 2>/dev/null | grep -i nextdns" || echo "(NEXTDNS_API_BASE not in splunkd env)"
          echo "===== inputs.conf (were the inputs created + enabled?) ====="
          docker exec ta_nextdns_api_splunk /opt/splunk/bin/splunk btool inputs list --app=TA-nextdns-api 2>/dev/null || true
          echo "===== collector add-on logs (which URL, any exception) ====="
          docker exec ta_nextdns_api_splunk bash -lc 'tail -n 120 /opt/splunk/var/log/splunk/ta-nextdns-api_*.log 2>/dev/null' || echo "(no add-on logs)"
          echo "===== mock request log (did the collectors reach the mock?) ====="
          docker compose logs --tail 100 mock || true
          echo "===== splunkd.log tail ====="
          docker exec ta_nextdns_api_splunk tail -n 120 /opt/splunk/var/log/splunk/splunkd.log || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main
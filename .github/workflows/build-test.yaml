name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly real-API canary — catches upstream NextDNS drift without
    # burning Actions minutes on every push.
    - cron: "17 6 * * 1"
permissions:
  pull-requests: write
  actions: write
  checks: write
# Cancel a superseded run on the same branch or pull request, so CI never
# spends time on code that has already been replaced. The default branch is
# never cancelled: every push there gets its own complete run, because a
# cancelled run on a branch that deploys or releases can let commits go out
# unchecked (haloclock-app, 13 Oct 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  package:
    # On the weekly schedule only the real-API canary runs (it builds the app
    # itself); skipping package here makes every dependent job skip too.
    if: github.event_name != 'schedule'
    # ubuntu-24.04 because ubuntu-latest (26.04) has no Python 3.9, which the
    # add-on build and Splunk 10.1-and-earlier parity need.
    runs-on: ubuntu-24.04
    steps:
      - name: Package app
        uses: livehybrid/deploy-splunk-app-action@main
        with:
          python-version: "3.9"

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
  
  unit:
    name: unit (python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    # ubuntu-24.04: ubuntu-latest (26.04) has no Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "requests>=2.32.0,<2.33.0" "pytest>=8"
      - run: pytest tests/unit -v -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  integration-test:
    name: integration-test (splunk-docker)
    needs: package
    # Dependabot actors get no egress/secrets, so a live-data E2E can only fail
    # for them. CLI AppInspect still covers Dependabot PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 10.0 is the oldest Splunk this add-on is tested on; 10.6.0 is current
        # (Postgres-backed KV store, Python 3.13 alongside 3.9).
        splunk: ["10.0", "10.6.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.1.0
          rm -rf stage && mkdir -p stage
          cp -r output/TA-nextdns-api stage/TA-nextdns-api
          # Point the collectors at the mock upstream via the app-local override
          # file (splunkd does not pass the container env var to modular-input
          # processes, so the env var alone does not reach them).
          mkdir -p stage/TA-nextdns-api/local
          echo "http://mock:8080" > stage/TA-nextdns-api/local/nextdns_api_base
          # The test container's splunk user (a different uid) must read the app
          # and write local/inputs.conf + checkpoints into the bind mount. Wide
          # perms are fine on this throwaway copy — it is never the artefact.
          chmod -R 777 stage/TA-nextdns-api

      - name: Start Splunk (wait for health)
        working-directory: docker
        env:
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: docker compose up -d --wait --wait-timeout 360

      - name: Run integration suite (mock upstream)
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_nextdns_api_splunk
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: pytest tests --ignore=tests/live --ignore=tests/unit -v -ra -p no:cacheprovider

      - name: Diagnostics on failure (synthetic data only)
        if: failure()
        working-directory: docker
        run: |
          echo "===== inputs.conf ====="
          docker exec ta_nextdns_api_splunk /opt/splunk/bin/splunk btool inputs list --app=TA-nextdns-api 2>/dev/null || true
          echo "===== add-on logs ====="
          docker exec -u root ta_nextdns_api_splunk bash -lc 'tail -n 60 /opt/splunk/var/log/splunk/ta-nextdns-api_*.log 2>/dev/null' || echo "(no add-on logs)"
          echo "===== mock requests by path and status ====="
          curl -s http://127.0.0.1:8080/__mock/requests | python3 -c "import collections,json,sys; print(collections.Counter((r['path'], r['status']) for r in json.load(sys.stdin)['data']).most_common(40))" || true
          echo "===== splunkd.log tail ====="
          docker exec ta_nextdns_api_splunk tail -n 80 /opt/splunk/var/log/splunk/splunkd.log || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  live-real-api:
    name: live-real-api (real NextDNS)
    # Every input against the real api.nextdns.io in real Splunk. Only on
    # pushes to main, the weekly schedule and manual runs: never for pull
    # requests or other branches, never for Dependabot. Not a release gate.
    # William's DNS data is private and this repo is public: the tests assert
    # and print counts and field names only, pytest runs with --tb=no -rN, and
    # nothing from Splunk or the add-on is dumped on failure.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/ (no mock override -> real API)
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.1.0 >/dev/null
          rm -rf stage && mkdir -p stage
          cp -r output/TA-nextdns-api stage/TA-nextdns-api
          chmod -R 777 stage/TA-nextdns-api

      - name: Start Splunk (real API base)
        working-directory: docker
        env:
          NEXTDNS_API_BASE: https://api.nextdns.io
          SPLUNK_IMAGE_TAG: "10.6.0"
        run: docker compose up -d --wait --wait-timeout 360 >/dev/null

      - name: Load the API key
        env:
          SECRET_KEY: ${{ secrets.NEXTDNS_API_KEY }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          KEY="$SECRET_KEY"
          SRC=secret
          if [ -z "$KEY" ] && [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            curl -sSfL https://cache.agilebits.com/dist/1P/op2/pkg/v2.30.0/op_linux_amd64_v2.30.0.zip -o /tmp/op.zip
            (cd /tmp && unzip -oq op.zip op && sudo mv op /usr/local/bin/op)
            KEY=$(op read "op://cicd/my.nextdns.io/password")
            SRC=1password
            echo "::add-mask::$KEY"
          fi
          if [ -z "$KEY" ]; then echo "no NextDNS key available" >&2; exit 1; fi
          echo "key source: $SRC"
          echo "NEXTDNS_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Live end to end (counts only)
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_nextdns_api_splunk
          SPLUNK_IMAGE_TAG: "10.6.0"
          LIVE_SUMMARY: ${{ runner.temp }}/live-summary.json
        run: pytest tests/live -v --tb=no -rN -p no:cacheprovider -p no:warnings

      - name: Summary (counts and field names only)
        if: always()
        run: cat "${{ runner.temp }}/live-summary.json" 2>/dev/null || echo "no summary written"

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v >/dev/null 2>&1 || true

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - unit
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main

  publish-splunkbase:
    # Tag runs only: needs the GitHub release (every CLI gate + integration
    # tests) and Splunk's hosted AppInspect. Uploads stay off unless the repo
    # variable SPLUNKBASE_PUBLISH_ENABLED=true. Versions claimed: 10.0 and 10.6
    # are tested in CI, the releases between share their runtimes.
    needs:
      - publish-gh
      - quality-appinspect-api
    permissions:
      contents: read
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish-splunkbase.yml@main
    with:
      app_id: "7537"
      splunk_versions: "10.6,10.5,10.4,10.3,10.2,10.1,10.0"
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}

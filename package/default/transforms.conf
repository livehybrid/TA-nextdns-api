# INGEST_EVAL runs before any search-time extraction, so the JSON fields are
# read with json_extract(); a bare `status` is null at this point.
[nextdns_stream_set_blocked]
INGEST_EVAL = blocked = if(json_extract(_raw,"status")=="blocked","blocked","permitted")

[nextdns_stream_set_action]
INGEST_EVAL = action = json_extract(_raw,"status")

[nextdns_stream_set_status]
INGEST_EVAL = status=IF(json_extract(_raw,"status")=="blocked","blocked",null()), _raw=json_delete(_raw,"status")

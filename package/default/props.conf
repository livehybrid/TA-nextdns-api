[NextDNS_API_Stream]
TRANSFORMS-indexFields = nextdns_stream_set_blocked, nextdns_stream_set_action, nextdns_stream_set_status
EVAL-reasons = mvzip('reasons{}.id','reasons{}.name'," - ")
# device_name is the NextDNS device (was the Splunk host, i.e. the profile id)
EVAL-device_name = 'device.name'
FIELDALIAS-align = clientIp ASNEW client_ip root ASNEW root_domain
